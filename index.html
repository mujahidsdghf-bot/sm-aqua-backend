<!DOCTYPE html>
<html>
<head>
  <title>SM Aqua</title>
</head>
<body>

<h1>SM Aqua Water Service</h1>

<form id="orderForm">
  <input type="text" placeholder="Your Name" id="name" required><br><br>
  <input type="text" placeholder="Water Type" id="water" required><br><br>
  <button type="submit">Order</button>
</form>

<script>
document.getElementById("orderForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const name = document.getElementById("name").value;
  const water = document.getElementById("water").value;

  await fetch("https://sm-aqua-backend-1.onrender.com", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, water })
  });

  alert("Order Sent ✅");
});
</script>

</body>
</html>
