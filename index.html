<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM Aqua Water Service</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f8ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { color: #0077cc; text-align: center; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #0077cc; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #005fa3; }
        .loading { display: none; text-align: center; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>SM Aqua Service</h2>
    <form id="orderForm">
        <input type="text" id="name" placeholder="మీ పేరు (Your Name)" required>
        <input type="tel" id="phone" placeholder="ఫోన్ నంబర్ (Phone)" required>
        
        <select id="machine">
            <option value="Domestic RO">Domestic RO</option>
            <option value="Wall Mount RO">Wall Mount RO</option>
            <option value="Under Sink RO">Under Sink RO</option>
        </select>

        <select id="capacity">
            <option value="10 LPH">10 LPH</option>
            <option value="15 LPH">15 LPH</option>
            <option value="20 LPH">20 LPH</option>
        </select>

        <button type="submit" id="submitBtn">Order Now</button>
        <div id="loadingMsg" class="loading">పంపుతున్నాము... దయచేసి ఆగండి...</div>
    </form>
</div>

<script>
    const form = document.getElementById('orderForm');
    const btn = document.getElementById('submitBtn');
    const loader = document.getElementById('loadingMsg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // వివరాలు సేకరించడం
        const data = {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            machine: document.getElementById('machine').value,
            capacity: document.getElementById('capacity').value
        };

        // బటన్ డిసేబుల్ చేయడం
        btn.disabled = true;
        btn.style.backgroundColor = "#ccc";
        loader.style.display = "block";

        try {
            // రైల్వే సర్వర్‌కి డేటా పంపడం
            const response = await fetch("https://sm-aqua-backend-production.up.railway.app/order", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                alert("ఆర్డర్ విజయవంతంగా అందింది! ✅ మీకు త్వరలో వాట్సాప్ మెసేజ్ వస్తుంది.");
                form.reset();
            } else {
                alert("ఎర్రర్: " + result.error);
            }
        } catch (error) {
            console.error(error);
            alert("సర్వర్ కనెక్ట్ అవ్వలేదు! మీ ఇంటర్నెట్ లేదా రైల్వే సర్వర్ చెక్ చేయండి.");
        } finally {
            btn.disabled = false;
            btn.style.backgroundColor = "#0077cc";
            loader.style.display = "none";
        }
    });
</script>

</body>
</html>
